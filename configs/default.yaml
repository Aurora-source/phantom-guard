# Phantom-Guard default configuration.
# Hand-set values live here; values learned from data live in configs/baseline.json
# (generated by scripts/learn_baseline.py). Anything marked UNVERIFIED is an assumption
# that matters for results and must stay configurable (see CLAUDE.md).

data:
  raw_dir: data/raw
  processed_dir: data/processed
  files:
    - emptyRoom.csv
    - onePersonMovingFrontAndBack.csv
    - onePersonMovingSideToSide.csv
    - multiplePeopleChaotic.csv

units:
  # UNVERIFIED. 1 tick = 0.1 ms gives a 33.2 ms cycle. Supported by ghost displacement and by the
  # 2-3 tick spacing of back-to-back 8-byte CAN frames at 500 kbps (~0.23-0.27 ms per frame).
  tick_seconds: 1.0e-4

protocol:
  header_can_id: 0x60A
  object_can_id: 0x60B
  # UNVERIFIED: the CSVs do not store the header DLC. Bytes 0-4 are known; we rebuild 5 bytes.
  header_len: 5
  object_len: 8
  header_status_ok: 0x01
  # Cycles at the start of a stream whose period is not checked (capture-start flush, see decisions.md).
  cadence_warmup_cycles: 2

roi:
  # UNVERIFIED distance units: coordinates may not be true metres. Provisional ROI.
  max_range: 15.0

zones:
  near_max_range: 4.0
  mid_max_range: 15.0

motion:
  # Same as tools/decode.py: just above one 0.25 m/s velocity quantisation step.
  moving_threshold_mps: 0.30

splits:
  train_frac: 0.6
  val_frac: 0.2
  # test = remainder (0.2)

baseline:
  # Rules used to turn clean-data distributions into thresholds (recorded with each threshold).
  hard_quantile: 0.999      # two-sided limits use (1-q, q)
  soft_quantile: 0.99
  margin_ticks: 2           # added to timing limits learned from train (one CAN frame ~2-3 ticks)

tracks:
  # A slot whose position jumps more than this between consecutive cycles is treated as a new track.
  # Learned value overrides this default once baseline.json exists (key: reassign_jump).
  reassign_jump_default: 1.0
  min_track_cycles_for_stats: 20

kinematic:
  window_cycles: 15         # cycles used for range-rate vs reported radial velocity
  rcs_window_cycles: 15
  min_moving_cycles: 10     # a track counts as moving if it has this many moving cycles

replay:
  k_gram: 12                # cycles per fingerprint window
  disp_quant: 0.2           # displacement quantisation for fingerprints
  vel_quant: 0.25
  min_complexity: 4         # distinct (dx, dy, vr) symbols needed in a window to fingerprint it
  history_cycles: 20000     # how much of the stream's own past to remember

learned:
  window_cycles: 10
  hidden: 32
  latent: 6
  epochs: 30
  batch_size: 512
  lr: 0.001
  max_train_seconds: 300
  threshold_quantile: 0.999
  iforest_trees: 200

fusion:
  m: 3
  n: 5

attack:
  seeds: [11, 22, 33]
  instances_per_run: 6
  min_gap_cycles: 60        # clean cycles between attack instances
  T1: {count: [1, 3], life: [20, 150]}
  T2: {count: [10, 30], life: [10, 60]}
  T3: {min_len: 20, max_len: 80}
  T4: {life: [20, 80], drift_per_cycle: [0.02, 0.08]}

eval:
  runs_per_cell: 3
  workers: 4

latency:
  p99_budget_ms: 10.0

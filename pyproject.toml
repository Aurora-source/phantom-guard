[build-system]
requires = ["setuptools==78.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "phantomguard"
version = "0.2.0"
description = "Detect fabricated CAN frames injected into an SR75 radar stream (offline prototype)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pyyaml==6.0.3",
    "waitress==3.0.2",
]

[project.optional-dependencies]
evaluation = ["pandas==3.0.6", "scikit-learn==1.9.1"]
viewer = ["matplotlib==3.11.2", "pillow==12.3.0"]
training = ["torch==2.14.1", "pandas==3.0.6", "scikit-learn==1.9.1"]
dev = ["pytest==9.1.1", "pandas==3.0.6", "scikit-learn==1.9.1", "matplotlib==3.11.2", "pillow==12.3.0", "playwright==1.58.0"]

[project.scripts]
phantomguard = "phantomguard.cli:main"

[tool.setuptools.package-data]
phantomguard = ["resources/*.yaml", "web/static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the CSVs in data/raw", "slow: takes more than a few seconds"]
